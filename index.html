<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>장항공장 안전순찰</title>
<link rel="stylesheet" href="portal.css">
<style>
.page{max-width:1280px;margin:0 auto;padding:16px 16px 24px;display:grid;grid-template-columns:1fr;gap:16px}
.col{display:contents}
.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}.o8{order:8}
@media(min-width:1000px){
  .page{grid-template-columns:1fr 1.25fr 1fr;align-items:start}
  .col{display:flex;flex-direction:column;gap:16px;min-width:0}
}
.meta-line{grid-column:1/-1;order:0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
/* 무재해 타일 */
.hero{background:var(--brand);color:#fff;padding:20px 22px;position:relative;overflow:hidden;min-height:150px}
.hero .lb{font-size:14px;opacity:.9}
.hero .num{font-size:44px;font-weight:800;line-height:1.1;letter-spacing:-1px}
.hero .num small{font-size:18px;font-weight:600;margin-left:4px}
.hero .sl{margin-top:10px;font-size:14.5px;font-weight:600;max-width:78%;position:relative;z-index:1}
.hero .dt{position:absolute;right:18px;top:16px;font-size:12.5px;opacity:.85}
.hero .ic{position:absolute;right:10px;bottom:-10px;font-size:64px;opacity:.18}
/* 순찰 현황 */
.stat .big{text-align:center;padding:14px 0 10px}
.stat .big b{display:block;font-size:40px;font-weight:700;color:var(--text);letter-spacing:-1px}
.stat .big span{color:var(--sub);font-size:14px}
.stat .band{background:var(--accent);color:#fff;text-align:center;font-weight:700;padding:9px 10px;font-size:14px}
.stat .cells{display:grid;grid-template-columns:repeat(3,1fr)}
.stat .cells div{text-align:center;padding:12px 4px;border-right:1px solid var(--line)}
.stat .cells div:last-child{border-right:0}
.stat .cells b{display:block;font-size:20px}
.stat .cells span{font-size:12.5px;color:var(--sub)}
.stat-h{justify-content:center}
.stat-h h2{color:var(--accent)}
/* 공지 */
.notice{display:flex;gap:10px;padding:14px 16px;font-size:14.5px}
.notice b{color:var(--mid)}
/* 일정 */
.sched ul{list-style:none;margin:0;padding:0}
.sched li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sched li:last-child{border-bottom:0}
.date{min-width:52px;text-align:center;background:var(--brand-soft);color:var(--brand-strong);padding:4px 0;font-weight:700;font-size:14px;line-height:1.2;border-radius:4px}
.date span{display:block;font-size:11px;font-weight:500}
.today{outline:2px solid var(--brand-strong)}
.sched .t{font-weight:700}
.sched .d{font-size:13px;color:var(--sub)}
/* 순찰 결과 (메일 목록 형태) */
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:12px 0 6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand-strong);color:#fff;border-color:var(--brand-strong)}
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .title{font-weight:700;font-size:15.5px;display:flex;gap:8px;align-items:flex-start}
.item .title span{flex:1}
.item .meta{font-size:13px;color:var(--sub);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.item .meta .dt{margin-left:auto}
.badge{font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 7px}
.b-high{background:var(--high-soft);color:var(--high)}
.b-mid{background:var(--mid-soft);color:var(--mid)}
.b-low{background:var(--low-soft);color:var(--low)}
.b-type{background:var(--bg);color:var(--sub)}
.s{font-size:12px;font-weight:700;border-radius:4px;padding:1px 8px;border:1px solid var(--line);white-space:nowrap}
.s-open{color:var(--high)} .s-prog{color:var(--mid)} .s-done{color:var(--done);background:var(--done-soft);border-color:transparent}
.golink{display:block;text-align:center;padding:12px;background:var(--brand-soft);color:var(--brand-strong);font-weight:700;text-decoration:none;margin-top:8px;border-radius:4px}
.empty{text-align:center;color:var(--sub);padding:20px 0}
/* TOP5 */
.bars .row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;margin:10px 0;font-size:14px}
.bars .rank{font-weight:800;color:var(--brand-strong)}
.bar{height:7px;background:var(--line);border-radius:4px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.bars .n{font-size:13px;color:var(--sub)}
/* 위험구역 */
.zone{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.zone:last-child{border-bottom:0}
.zone .ic{font-size:26px;line-height:1;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--high-soft);border-radius:50%;flex:none}
.zone b{display:block}
.zone span{font-size:13px;color:var(--sub)}
.good{padding:14px 16px;font-size:14.5px}
.good b{color:var(--done)}
/* 제보 버튼 · 창 */
.fab{position:fixed;left:16px;right:16px;bottom:16px;z-index:15;margin:0 auto;max-width:520px;
  background:var(--high);color:#fff;border:0;border-radius:12px;padding:15px;font:inherit;font-size:16.5px;font-weight:700;
  box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
@media(min-width:1000px){.fab{left:auto;right:28px;bottom:24px;width:auto;padding:14px 22px}}
dialog{border:0;border-radius:12px;padding:0;width:calc(100% - 32px);max-width:480px;background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog form{padding:18px}
dialog h3{margin:0 0 4px}
dialog p{margin:0 0 12px;font-size:13px;color:var(--sub)}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
dialog input,dialog select,dialog textarea{width:100%;font:inherit;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
textarea{min-height:90px}
.opt{font-weight:400;color:var(--sub)}
.btns{display:flex;gap:8px;margin-top:14px}
.btns button{flex:1;padding:12px;border-radius:8px;border:1px solid var(--line);font:inherit;font-weight:700;cursor:pointer;background:var(--card);color:var(--text)}
.btns .primary{background:var(--high);color:#fff;border-color:var(--high)}
</style>
</head>
<body>

<header class="topbar">
  <div class="in">
    <a class="brand" href="index.html" id="home"><img class="logo" src="hansol-logo.png" alt="Hansol 한솔제지" width="153" height="35"><span data-i18n="title"></span></a>
    <nav class="gnb">
      <a href="#results" class="on" data-i18n="results"></a>
      <a href="corrective.html" class="navc" data-i18n="navCorrective"></a>
      <a href="roster.html" class="navr" data-i18n="navRoster"></a>
      <a href="#zones" data-i18n="zones"></a>
      <a href="#sched" data-i18n="schedule"></a>
      <button type="button" id="navReport" data-i18n="navReport"></button>
    </nav>
    <div class="langbox"><span aria-hidden="true">🌐</span><select class="lang" id="lang" aria-label="Language"></select></div>
  </div>
</header>

<main class="page">
  <div class="meta-line"><p class="demo" data-i18n="demo"></p><p class="pnote" data-i18n="placeNote"></p></div>

  <div class="col">
    <div class="hero o1">
      <div class="dt" id="today"></div>
      <div class="lb" data-i18n="noAccident"></div>
      <div class="num" id="days"></div>
      <div class="sl" id="slogan"></div>
      <div class="ic" aria-hidden="true">⛑️</div>
    </div>
    <div class="panel o3"><div class="notice" id="notice"></div></div>
    <section class="panel o7" id="zones">
      <div class="panel-h"><h2>⚠️ <span data-i18n="zones"></span></h2></div>
      <div class="panel-b" id="zoneList"></div>
    </section>
  </div>

  <div class="col">
    <section class="panel o5" id="results">
      <div class="panel-h"><h2>🔍 <span data-i18n="results"></span></h2><span class="more" id="resultCount"></span></div>
      <div class="panel-b">
        <div class="chips" id="chips"></div>
        <div id="resultList"></div>
        <a class="golink navc" href="corrective.html" data-i18n="golink"></a>
      </div>
    </section>
  </div>

  <div class="col">
    <section class="panel stat o2">
      <div class="panel-h stat-h"><h2 data-i18n="monthStatus"></h2></div>
      <div class="big"><b id="rate"></b><span data-i18n="doneRate"></span></div>
      <div class="band" id="band"></div>
      <div class="cells" id="cells"></div>
    </section>
    <section class="panel o4" id="sched">
      <div class="panel-h"><h2>📅 <span data-i18n="schedule"></span></h2></div>
      <div class="panel-b sched"><ul id="schedList"></ul></div>
    </section>
    <section class="panel o6">
      <div class="panel-h"><h2>🔁 <span data-i18n="top5"></span></h2><span class="more" data-i18n="last3m"></span></div>
      <div class="panel-b bars" id="top5"></div>
    </section>
    <section class="panel o8">
      <div class="panel-h"><h2>👍 <span data-i18n="good"></span></h2></div>
      <div class="good" id="good"></div>
    </section>
  </div>
</main>

<footer class="foot">
  <span data-i18n="contact"></span><br>
  <span data-i18n="stopWork"></span>
</footer>

<button class="fab" id="reportBtn" data-i18n="reportBtn"></button>

<dialog id="dlg">
  <form method="dialog" id="reportForm">
    <h3 data-i18n="dlgTitle"></h3>
    <p data-i18n="dlgSub"></p>
    <label data-i18n="place"></label>
    <select required id="fZone"></select>
    <label data-i18n="what"></label>
    <textarea required data-i18n-ph="whatPh"></textarea>
    <label><span data-i18n="photo"></span> <span class="opt" data-i18n="optional"></span></label>
    <input type="file" accept="image/*" capture="environment">
    <label><span data-i18n="who"></span> <span class="opt" data-i18n="optional"></span></label>
    <input data-i18n-ph="whoPh">
    <div class="btns">
      <button value="cancel" formnovalidate data-i18n="cancel"></button>
      <button class="primary" value="ok" data-i18n="submit"></button>
    </div>
  </form>
</dialog>

<script src="i18n.js"></script>

      desc: { ko: "가동 중 손 넣기 절대 금지. 정비 시 반드시 잠금·표지(LOTO)", en: "Never put your hands in while running. Always lock out & tag out (LOTO) for maintenance.", vi: "Tuyệt đối không cho tay vào khi máy đang chạy. Khi bảo trì phải khóa và treo biển (LOTO).", ne: "मेसिन चलिरहँदा कहिल्यै हात नछिराउनुहोस्। मर्मत गर्दा अनिवार्य रूपमा लक र ट्याग (LOTO) गर्नुहोस्।", id: "Dilarang keras memasukkan tangan saat mesin berjalan. Saat perawatan wajib kunci & pasang label (LOTO).", th: "ห้ามยื่นมือเข้าไปขณะเครื่องทำงานเด็ดขาด เมื่อซ่อมบำรุงต้องล็อกและติดป้าย (LOTO) ทุกครั้ง", zh: "运行中严禁伸手。检修时必须上锁挂牌（LOTO）。" } },
    { icon: "🫁",
      name: { ko: "펄프 탱크 · 맨홀 (밀폐공간)", en: "Pulp tanks · manholes (confined space)", vi: "Bồn bột giấy · hố ga (không gian kín)", ne: "पल्प ट्याङ्की · म्यानहोल (बन्द ठाउँ)", id: "Tangki pulp · manhole (ruang terbatas)", th: "ถังเยื่อกระดาษ · ช่องคนลอด (ที่อับอากาศ)", zh: "纸浆罐 · 人孔（密闭空间）" },
      desc: { ko: "출입 전 산소·유해가스 측정, 감시인 배치, 허가서 필수", en: "Before entry: measure oxygen & toxic gas, assign a watcher, permit required.", vi: "Trước khi vào: đo oxy và khí độc, bố trí người giám sát, bắt buộc có giấy phép.", ne: "भित्र पस्नु अघि: अक्सिजन र विषाक्त ग्यास नाप्नुहोस्, निगरानीकर्ता राख्नुहोस्, अनुमति पत्र अनिवार्य।", id: "Sebelum masuk: ukur oksigen & gas beracun, tempatkan pengawas, wajib izin kerja.", th: "ก่อนเข้า: วัดออกซิเจนและแก๊สพิษ จัดผู้เฝ้าระวัง ต้องมีใบอนุญาต", zh: "进入前：测量氧气和有毒气体，安排监护人，必须持有作业许可证。" } },
    { icon: "🚜",
      name: { ko: "출하장 · 창고 지게차 구역", en: "Shipping area · warehouse forklift zone", vi: "Khu xuất hàng · khu xe nâng trong kho", ne: "ढुवानी क्षेत्र · गोदाम फोर्कलिफ्ट क्षेत्र", id: "Area pengiriman · zona forklift gudang", th: "ลานขนส่ง · พื้นที่รถยกในคลังสินค้า", zh: "出货场 · 仓库叉车区域" },
      desc: { ko: "보행자는 녹색 보행로로만 이동, 지게차 후방 접근 금지", en: "Pedestrians walk only on the green walkway. Do not approach behind forklifts.", vi: "Người đi bộ chỉ đi trên lối đi màu xanh. Không đến gần phía sau xe nâng.", ne: "पैदल यात्री हरियो बाटोमा मात्र हिँड्नुहोस्। फोर्कलिफ्टको पछाडि नजानुहोस्।", id: "Pejalan kaki hanya lewat jalur hijau. Jangan mendekati bagian belakang forklift.", th: "คนเดินเท้าเดินเฉพาะทางเดินสีเขียว ห้ามเข้าใกล้ด้านหลังรถยก", zh: "行人只能走绿色人行通道，禁止靠近叉车后方。" } },
    { icon: "🔥",
      name: { ko: "보일러 · 고온 배관", en: "Boiler · hot pipes", vi: "Lò hơi · đường ống nhiệt độ cao", ne: "बोइलर · तातो पाइप", id: "Boiler · pipa panas", th: "หม้อไอน้ำ · ท่อความร้อนสูง", zh: "锅炉 · 高温管道" },
      desc: { ko: "화상 주의, 허가 없는 화기작업 금지", en: "Beware of burns. No hot work without a permit.", vi: "Cẩn thận bỏng. Cấm làm việc có lửa khi chưa có giấy phép.", ne: "पोलिनबाट सावधान। अनुमति बिना आगो सम्बन्धी काम निषेध।", id: "Awas luka bakar. Dilarang pekerjaan panas tanpa izin.", th: "ระวังไฟลวก ห้ามทำงานที่เกิดประกายไฟโดยไม่มีใบอนุญาต", zh: "注意烫伤，未经许可禁止动火作业。" } }
  ],
  // 번역을 넣지 않은 예: 다른 언어를 골라도 한국어로 표시됩니다
  good: "<b>협력사 ○○기공</b> — 정비동 작업 전 위험성평가(TBM) 사진 기록을 매일 공유하고, 작업 후 정리정돈 상태를 스스로 점검해 이번 달 지적 0건을 달성했습니다.",
  // 실제 운영 시: 제보 양식 주소(예: Microsoft Forms 링크)를 넣으면 버튼이 그 양식으로 연결됩니다.
  reportFormUrl: ""
};
/* =================== ▲ 수정 부분 끝 =================== */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t = (k, v) => I18N.t(k, v), tr = x => I18N.tr(x);
const LVC = { high:"b-high", mid:"b-mid", low:"b-low" };
const STC = { open:"s-open", prog:"s-prog", done:"s-done" };
const now = new Date();
const todayStr = now.toISOString().slice(0,10);
let filter = "all";

function render(){
  const loc = I18N.locale;
  $("#today").textContent = now.toLocaleDateString(loc, { month:"long", day:"numeric", weekday:"short" });
  $("#days").innerHTML = DATA.noAccidentDays + "<small>" + esc(t("uDay")) + "</small>";
  $("#slogan").textContent = tr(DATA.slogan);
  $("#notice").innerHTML = "📢 <div>" + tr(DATA.notice) + "</div>";
  document.querySelectorAll(".navc").forEach(a => a.href = "corrective.html?lang=" + I18N.lang);
  document.querySelectorAll(".navr").forEach(a => a.href = "roster.html?lang=" + I18N.lang);
  $("#home").href = "index.html?lang=" + I18N.lang;

  const rate = Math.round(DATA.stats.done / DATA.stats.findings * 100);
  $("#rate").textContent = rate + "%";
  const u = k => (["ko","zh"].includes(I18N.lang) ? "" : " ") + t(k);
  $("#band").textContent = `${t("findings")} ${DATA.stats.findings}${u("uCases")} · ${t("completed")} ${DATA.stats.done}${u("uCases")}`;
  $("#cells").innerHTML = [
    [t("patrols"), DATA.stats.patrols + u("uTimes")],
    [t("findings"), DATA.stats.findings + u("uCases")],
    [t("open"), (DATA.stats.findings - DATA.stats.done) + u("uCases")]
  ].map(([k,v]) => `<div><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join("");

  $("#schedList").innerHTML = DATA.schedule.map(s => {
    const d = new Date(s.date + "T00:00:00");
    return `<li><div class="date ${s.date===todayStr?'today':''}">${d.getMonth()+1}.${d.getDate()}<span>${esc(d.toLocaleDateString(loc,{weekday:"short"}))}</span></div>
      <div><div class="t">${esc(s.area)}</div><div class="d">${esc(tr(s.type))} · ${esc(s.by)}</div></div></li>`;
  }).join("");

  renderResults();

  const max = Math.max(...DATA.top5.map(x=>x.n));
  $("#top5").innerHTML = DATA.top5.map((x,i) => `<div class="row"><span class="rank">${i+1}</span>
    <div>${esc(tr(x.name))}<div class="bar"><i style="width:${x.n/max*100}%"></i></div></div><span class="n">${x.n}</span></div>`).join("");

  $("#zoneList").innerHTML = DATA.zones.map(z => `<div class="zone"><div class="ic">${z.icon}</div><div><b>${esc(tr(z.name))}</b><span>${esc(tr(z.desc))}</span></div></div>`).join("");
  $("#good").innerHTML = tr(DATA.good);

  const zoneOpts = [...new Set(DATA.schedule.map(s=>s.area).concat(DATA.zones.map(z=>tr(z.name))))];
  $("#fZone").innerHTML = `<option value="" disabled selected>${esc(t("select"))}</option>` +
    zoneOpts.concat(t("other")).map(z=>`<option>${esc(z)}</option>`).join("");
}

function renderResults(){
  const F = ["all","open","prog","done"];
  $("#chips").innerHTML = F.map(k => {
    const n = k==="all" ? DATA.results.length : DATA.results.filter(r=>r.status===k).length;
    return `<button class="chip" aria-pressed="${filter===k}" data-f="${k}">${esc(t(k))} ${n}</button>`;
  }).join("");
  $("#resultCount").textContent = t("recentN", { n: DATA.results.length });
  const list = DATA.results.filter(r => filter==="all" || r.status===filter);
  $("#resultList").innerHTML = list.map(r => `<div class="item">
      <div class="title"><span>${esc(tr(r.title))}</span><span class="s ${STC[r.status]}" style="flex:none">${esc(t(r.status))}</span></div>
      <div class="meta"><span class="badge ${LVC[r.level]}">${esc(t("risk"))} ${esc(t(r.level))}</span>
      <span class="badge b-type">${esc(tr(r.type))}</span> 📍 ${esc(r.area)} <span class="dt">${esc(r.date)}</span></div></div>`).join("")
    || `<div class="empty">${esc(t("none"))}</div>`;
}

$("#chips").addEventListener("click", e => { const f = e.target.dataset.f; if(f){ filter=f; renderResults(); }});
$("#navReport").onclick = () => $("#reportBtn").click();
$("#reportBtn").onclick = () => DATA.reportFormUrl ? location.href = DATA.reportFormUrl : $("#dlg").showModal();
$("#dlg").addEventListener("close", () => {
  if ($("#dlg").returnValue === "ok") alert(t("thanks"));
  $("#reportForm").reset();
});
I18N.mountPicker($("#lang"), render);
render();
</script>
</body>
</html>
