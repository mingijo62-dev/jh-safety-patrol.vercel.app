  --sh-day:#dbeafe; --sh-day-t:#1e4fa3;
  --sh-eve:#fff1d6; --sh-eve-t:#8a5300;
  --sh-night:#2f3a68; --sh-night-t:#ffffff;
  --sh-off:#eef0f3; --sh-off-t:#6b7480;
  --sh-rest:#f5f6f8; --sh-rest-t:#8b939d;
  --sh-leave:#dcf3e1; --sh-leave-t:#23692f;
  --sh-edu:#efe4fb; --sh-edu-t:#6b3fa0;
  --today:#ffe3e5;
}
@media (prefers-color-scheme: dark){
  :root{
    --sh-day:#1b3256; --sh-day-t:#bcd6ff;
    --sh-eve:#3d2f12; --sh-eve-t:#ffd58a;

}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px 40px}
.ptitle{padding:18px 0 6px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ptitle h1{margin:0;font-size:22px;color:var(--brand-strong)}
.ptitle p{margin:2px 0 0;font-size:13.5px;color:var(--sub)}
.ptitle .tt{flex:1;min-width:220px}
.pv{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:6px;padding:7px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.banner{display:none;margin-top:10px;background:var(--mid-soft);color:var(--mid);padding:10px 14px;font-size:13.5px;font-weight:700;align-items:center;gap:10px;flex-wrap:wrap}
.banner.on{display:flex}
.banner span{flex:1}
.banner button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:6px;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer}

.todaybox{margin-top:14px}
.todaybox .panel-b{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px}
.tchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:14px}
.tchip b{font-size:14px}

.tabs{display:flex;gap:4px;margin-top:16px;overflow-x:auto;scrollbar-width:none}
.tab{border:1px solid var(--line);border-bottom:0;background:var(--bar);color:var(--text);padding:7px 16px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;border-radius:6px 6px 0 0;white-space:nowrap}

.sheet{background:var(--card);border:1px solid var(--line);border-top:2px solid #b9c4d0}

.tw{overflow:auto;max-height:70vh}
table.r{border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:100%}

.c{display:inline-block;min-width:26px;padding:1px 4px;border-radius:4px;font-weight:700}
.s-day{background:var(--sh-day);color:var(--sh-day-t)}
.s-eve{background:var(--sh-eve);color:var(--sh-eve-t)}
.s-night{background:var(--sh-night);color:var(--sh-night-t)}

.s-edu{background:var(--sh-edu);color:var(--sh-edu-t)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:12px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--sub)}

.legend span{display:flex;align-items:center;gap:6px}
.msg{padding:40px 16px;text-align:center;color:var(--sub)}
/* 근무 편성표(날짜별 근무자) */
.duty-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.duty-h h2{margin:0;font-size:16.5px;flex:1;min-width:220px}

.wk{padding:12px 14px;border-bottom:1px solid var(--line)}

.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
@media(min-width:1000px){.days{grid-template-columns:repeat(7,1fr)}}
.day{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card)}

mark{background:#ffe066;color:#000;border-radius:3px;padding:0 2px}

<script>
/* ===================================================
   ▼ 설정
   - 근무표 파일 이름: 사이트에 올리는 파일 이름입니다. 같은 이름으로 덮어 올리면 갱신됩니다.
     PPT(.pptx)를 먼저 찾고, 없으면 엑셀(.xlsx)을 찾습니다.
     PPT는 슬라이드 안의 "표"만 읽습니다. (그림으로 붙여 넣은 표는 읽을 수 없습니다)
   - 근무 구분 글자: 엑셀 칸에 적힌 글자를 아래 분류로 색칠합니다. 새 글자를 쓰면 여기에 추가하세요.
   =================================================== */
const ROSTER_FILES = ["근무표.pptx", "근무표.xlsx"];
const SHIFT_CODES = {
  day:   ["주", "주간", "D", "DAY", "일근"],
  eve:   ["오후", "중", "중간", "E", "S"],
  night: ["야", "야간", "N", "NIGHT"],
  rest:  ["비", "비번"],
  off:   ["휴", "휴무", "OFF", "O", "X", "-"],
  leave: ["연", "연차", "반", "반차", "휴가"],
  edu:   ["교", "교육"]
};
/* =================== ▲ 설정 끝 =================== */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t = (k, v) => I18N.t(k, v);
const CODE2 = {};
for (const k in SHIFT_CODES) SHIFT_CODES[k].forEach(c => CODE2[c.toUpperCase()] = k);
const shiftOf = v => CODE2[String(v).trim().toUpperCase()] || null;
const WEEK = "일월화수목금토";
const now = new Date(), Y = now.getFullYear(), M = now.getMonth() + 1, D = now.getDate();

let sheets = [], duty = null, published = null, cur = 0, preview = false, showPast = false;

/* 시트 한 장을 표 구조로 해석 */
function parseSheet(name, rows){
  rows = rows.map(r => r.map(c => String(c ?? "").trim()));
  while (rows.length && rows[rows.length-1].every(c => !c)) rows.pop();
  const width = Math.max(0, ...rows.map(r => r.length));
  // 머리글 줄: 절반 이상 채워진 첫 줄
  let h = rows.findIndex(r => r.filter(Boolean).length >= Math.max(2, width * 0.5));
  if (h < 0) h = 0;
  const title = rows.slice(0, h).map(r => r.filter(Boolean).join(" ")).filter(Boolean).join(" · ");
  const head = rows[h] || [];
  // 바로 다음 줄이 요일(월화수…)이면 보조 머리글로 사용
  let sub = null, start = h + 1;
  const nx = rows[h+1] || [];
  if (nx.slice(1).filter(c => c && "월화수목금토일".includes(c[0]) && c.length <= 3).length >= Math.max(3, (nx.length-1) * 0.6)) { sub = nx; start = h + 2; }
  const body = rows.slice(start).filter(r => r.some(Boolean));
  // 오늘 열 찾기
  const ctx = name + " " + title;
  const monthKnown = new RegExp(`(^|[^0-9])${M}\\s*월|${Y}[.\\-/]\\s*0?${M}([^0-9]|$)`).test(ctx);
  const anyMonth = /\d{1,2}\s*월/.test(ctx);
  let todayCol = -1;
  head.forEach((c, i) => {
    if (i === 0 || todayCol >= 0) return;
    let m;
    if ((m = c.match(/^(\d{1,2})\s*[./\-월]\s*(\d{1,2})/))) { if (+m[1] === M && +m[2] === D) todayCol = i; }
    else if ((m = c.match(/^(\d{1,2})\s*일?$/))) { if (+m[1] === D && (monthKnown || !anyMonth)) todayCol = i; }
  });
  // 요일 계산 (보조 머리글이 없을 때 주말 색 표시용)
  const weekdayOf = i => {
    if (sub) return sub[i] ? sub[i][0] : "";
    const m = head[i].match(/^(\d{1,2})\s*[./\-월]\s*(\d{1,2})/);
    if (m) return WEEK[new Date(Y, +m[1]-1, +m[2]).getDay()];
    return "";
  };
  return { name, title, head, sub, body, width, todayCol, weekdayOf, monthKnown };
}

/* 압축 파일 안의 항목 꺼내기 */
const zget = (zip, path) => { const i = zip.FullPaths.findIndex(f => f.endsWith("/" + path)); return i < 0 ? null : zip.FileIndex[i]; };

/* 날짜별 근무자 형식(근무 편성표) 해석
   - "구분 | 11/16(월) | 11/17(화) …" 같은 날짜 줄 아래에
     "오전 05~07시(줄바꿈)역할 | 이름(줄바꿈)이름 …" 줄이 이어지는 표 */
function parseDuty(rows){
  const out = []; let dates = null;
  const DR = /^(\d{1,2})\s*[\/.]\s*(\d{1,2})/;
  for (const r of rows) {
    const c0 = String(r[0] || "").replace(/\s+/g, "");
    const dn = r.slice(1).filter(c => DR.test(String(c).trim())).length;
    if ((c0 === "구분" && dn >= 2) || dn >= 3) {
      dates = r.map((c, i) => { const m = i ? String(c).trim().match(DR) : null; return m ? { m: +m[1], d: +m[2] } : null; });
      continue;
    }
    if (!dates) continue;
    const lines = String(r[0] || "").split("\n").map(x => x.trim()).filter(Boolean);
    if (!lines.length) continue;
    r.forEach((c, i) => {
      if (!i || !dates[i]) return;
      const people = String(c).split(/\n|,/).map(x => x.trim()).filter(Boolean);
      if (people.length) out.push({ ...dates[i], time: lines[0], role: lines.slice(1).join(" "), people });
    });
  }
  return out;
}
function buildDuty(entries, yearHint, title, notes){
  if (entries.length < 5) return null;
  let y = yearHint || Y, last = entries[0].m;
  const map = new Map();
  entries.forEach(e => {
    if (e.m < last - 6) y++;               // 12월 → 1월 넘어가면 다음 해
    last = e.m;
    const key = `${y}-${String(e.m).padStart(2, "0")}-${String(e.d).padStart(2, "0")}`;
    if (!map.has(key)) map.set(key, { key, date: new Date(y, e.m - 1, e.d), slots: [] });
    map.get(key).slots.push({ time: e.time, role: e.role, people: e.people });
  });
  const days = [...map.values()].sort((p, q) => p.date - q.date);
  return { title, notes: [...new Set(notes)], days };
}
const yearOf = txt => { const m = txt.match(/(?:'|’|‘)(\d{2})[.\s]|20(\d{2})\s*년/); return m ? 2000 + +(m[1] || m[2]) : null; };
const cleanTitle = s => s.replace(/^[■□▶●\s]*/, "").replace(/^유첨\s*\d*\)?\s*/, "").replace(/\(\s*\d+\s*\/\s*\d+\s*\)\s*$/, "").trim();

/* 파일 읽기: PPT(.pptx)면 슬라이드의 표, 아니면 엑셀 시트 → { sheets, duty } */
function load(buf){
  const u8 = new Uint8Array(buf);
  if (u8[0] === 0x50 && u8[1] === 0x4B) {            // zip 형식
    const zip = XLSX.CFB.read(u8, { type: "array" });
    if (zget(zip, "ppt/presentation.xml")) return loadPptx(zip);
  }
  const wb = XLSX.read(u8, { type: "array" });
  const raw = wb.SheetNames.map(n => [n, XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: "" })]);
  const entries = raw.flatMap(([n, rows]) => parseDuty(rows.map(r => r.map(c => String(c ?? "")))));
  const allText = raw.map(([n, rows]) => n + " " + rows.slice(0, 3).flat().join(" ")).join(" ");
  const duty = buildDuty(entries, yearOf(allText), cleanTitle(raw[0] ? raw[0][1].slice(0, 2).flat().filter(Boolean)[0] || raw[0][0] : ""), []);
  if (duty) return { sheets: [], duty };
  return { sheets: raw.map(([n, rows]) => parseSheet(n, rows)).filter(s => s.body.length), duty: null };
}

function loadPptx(zip){
  const A = "http://schemas.openxmlformats.org/drawingml/2006/main";
  const P = "http://schemas.openxmlformats.org/presentationml/2006/main";
  const dec = new TextDecoder("utf-8");
  // 문단과 줄바꿈(Shift+Enter)을 모두 줄바꿈으로 읽습니다
  const para = p => [...p.childNodes].map(n => n.localName === "br" ? "\n" : (n.localName === "r" || n.localName === "fld") ? [...n.getElementsByTagNameNS(A, "t")].map(x => x.textContent).join("") : "").join("");
  const text = el => [...el.getElementsByTagNameNS(A, "p")].map(para).join("\n").replace(/\u000b/g, "\n").trim();
  const slides = zip.FullPaths.map(f => (f.match(/ppt\/slides\/slide(\d+)\.xml$/) || [])[1]).filter(Boolean).map(Number).sort((a, b) => a - b);
  const found = [], dutyEntries = [], dutyNotes = [];
  let dutyTitle = "", allText = "";
  slides.forEach(n => {
    const e = zget(zip, `ppt/slides/slide${n}.xml`);
    if (!e) return;
    const doc = new DOMParser().parseFromString(dec.decode(e.content), "application/xml");
    // 슬라이드 제목과 글상자 문구
    let title = "";
    const boxes = [];
    for (const sp of doc.getElementsByTagNameNS(P, "sp")) {
      const tx = text(sp); if (!tx) continue;
      boxes.push(tx);
      const ph = sp.getElementsByTagNameNS(P, "ph")[0];
      if (!title && ph && /title/i.test(ph.getAttribute("type") || "")) title = tx.replace(/\n/g, " ");
    }
    allText += " " + boxes.join(" ");
    const tables = [...doc.getElementsByTagNameNS(A, "tbl")];
    let slideHasDuty = false;
    tables.forEach((tbl, ti) => {
      const rows = [...tbl.getElementsByTagNameNS(A, "tr")].map(tr =>
        [...tr.children].filter(c => c.localName === "tc").map(tc => tc.getAttribute("hMerge") || tc.getAttribute("vMerge") ? "" : text(tc)));
      const d = parseDuty(rows);
      if (d.length >= 5) { dutyEntries.push(...d); slideHasDuty = true; return; }
      const name = (title || `${t("rSlide")} ${n}`) + (tables.length > 1 ? ` (${ti + 1})` : "");
      found.push(parseSheet(name.length > 24 ? name.slice(0, 24) + "…" : name, title ? [[title], ...rows.map(r => r.map(c => c.replace(/\n/g, " ")))] : rows.map(r => r.map(c => c.replace(/\n/g, " ")))));
    });
    if (slideHasDuty) {
      const head = boxes.find(b => /편성|근무|당번|순찰/.test(b) && b.length < 120) || title;
      if (!dutyTitle && head) dutyTitle = cleanTitle(head.split("\n")[0]);
      boxes.forEach(b => b.split("\n").forEach(l => { if (/^\s*※/.test(l)) dutyNotes.push(l.trim()); }));
    }
  });
  const duty = buildDuty(dutyEntries, yearOf(allText), dutyTitle, dutyNotes);
  if (duty) return { sheets: [], duty };
  // 근무 글자(주/야/휴…)가 들어 있는 표만 근무표로 봅니다
  const score = s => s.body.reduce((n, r) => n + r.slice(1).filter(v => shiftOf(v)).length, 0);
  const rosters = found.filter(s => s.body.length && score(s) >= 5);
  return { sheets: rosters.length ? rosters : found.filter(s => s.body.length), duty: null };
}

function pickDefault(){
  const i = sheets.findIndex(s => s.todayCol >= 0);
  if (i >= 0) return i;
  const j = sheets.findIndex(s => s.monthKnown);
  return j >= 0 ? j : 0;
}

function render(){
  $("#home").href = "index.html?lang=" + I18N.lang;
  document.querySelectorAll(".navh").forEach(a => a.href = "index.html?lang=" + I18N.lang + a.getAttribute("href").replace(/^[^#]*/, ""));
  document.querySelectorAll(".navl").forEach(a => a.href = a.getAttribute("href").split("?")[0] + "?lang=" + I18N.lang);
  $("#banner").classList.toggle("on", preview);
  $("#duty").hidden = !duty;
  $("#gridWrap").hidden = !!duty;
  if (duty) return renderDuty();
  if (!sheets.length) return;

  $("#tabs").innerHTML = sheets.map((s, i) => `<button class="tab" role="tab" aria-selected="${i===cur}" data-i="${i}">${esc(s.name)}</button>`).join("");
  const s = sheets[cur];
  $("#sheetTitle").textContent = s.title || s.name;

  const q = $("#q").value.trim().toLowerCase();
  const rows = s.body.filter(r => !q || r.slice(0, 2).join(" ").toLowerCase().includes(q));
  const thCls = i => {
    const w = s.weekdayOf(i);
    return [i === s.todayCol ? "today" : "", w === "토" ? "sat" : "", w === "일" ? "sun" : ""].join(" ").trim();
  };
  const cols = [...Array(s.width).keys()];
  const cell = v => { const k = shiftOf(v); return k ? `<span class="c s-${k}">${esc(v)}</span>` : esc(v); };
  $("#tw").innerHTML = `<table class="r"><thead>
      <tr>${cols.map(i => `<th class="${i===0?'k':''} ${thCls(i)}"${i===s.todayCol?' id="tcol"':''}>${esc(s.head[i] || "")}</th>`).join("")}</tr>
      ${s.sub ? `<tr class="sub">${cols.map(i => `<th class="${i===0?'k':''} ${thCls(i)}">${esc(i===0 ? (s.sub[0]||"") : (s.sub[i]||""))}</th>`).join("")}</tr>` : ""}
    </thead><tbody>
      ${rows.map(r => `<tr>${cols.map(i => `<td class="${i===0?'k':''} ${i===s.todayCol?'today':''}">${i===0 ? esc(r[i]||"") : cell(r[i]||"")}</td>`).join("")}</tr>`).join("")
        || `<tr><td class="k" colspan="${s.width}">${esc(t("none"))}</td></tr>`}
    </tbody></table>`;

  // 오늘 열이 보이도록 가로 스크롤
  const tc = $("#tcol");
  if (tc) { const tw = $("#tw"); tw.scrollLeft = Math.max(0, tc.offsetLeft - tw.clientWidth / 2); }

  // 범례: 이 시트에 실제로 나온 구분만
  const used = {};
  s.body.forEach(r => r.slice(1).forEach(v => { const k = shiftOf(v); if (k) (used[k] = used[k] || new Set()).add(v); }));
  $("#legend").innerHTML = Object.keys(SHIFT_CODES).filter(k => used[k]).map(k =>
    `<span>${[...used[k]].map(v => `<span class="c s-${k}">${esc(v)}</span>`).join("")} ${esc(t("sh_" + k))}</span>`).join("");

  // 오늘 근무 요약
  const tb = $("#todaybox");
  if (s.todayCol >= 0) {
    tb.hidden = false;
    $("#todayLabel").textContent = now.toLocaleDateString(I18N.locale, { month: "long", day: "numeric", weekday: "short" });
    const groups = {};
    s.body.forEach(r => { const v = r[s.todayCol]; if (!v) return; (groups[v] = groups[v] || []).push(r[0]); });
    const order = Object.keys(SHIFT_CODES);
    const keys = Object.keys(groups).sort((a, b) => (order.indexOf(shiftOf(a)) + 99) % 99 - (order.indexOf(shiftOf(b)) + 99) % 99);
    $("#todayList").innerHTML = keys.map(v => {
      const k = shiftOf(v);
      return `<div class="tchip"><span class="c ${k ? "s-" + k : ""}">${esc(v)}</span>${k ? `<span style="color:var(--sub)">${esc(t("sh_" + k))}</span>` : ""}<b>${esc(groups[v].join(", "))}</b></div>`;
    }).join("");
  } else tb.hidden = true;
}

const dayKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const TODAY = dayKey(now);
const TOMORROW = dayKey(new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1));
const dLabel = d => d.toLocaleDateString(I18N.locale, { month: "numeric", day: "numeric", weekday: "short" });
const hl = (txt, q) => !q ? esc(txt) : esc(txt).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`);

function renderDuty(){
  $("#dutyTitle").textContent = duty.title || t("rTitle");
  const q = $("#dq").value.trim();
  const ql = q.toLowerCase();
  const match = day => day.slots.some(s => s.people.some(p => p.toLowerCase().includes(ql)));

  // 오늘 · 내일
  const tb = $("#todaybox");
  const td = duty.days.find(d => d.key === TODAY), tm = duty.days.find(d => d.key === TOMORROW);
  if (td || tm) {
    tb.hidden = false;
    $("#todayLabel").textContent = dLabel(now);
    const line = (lab, d) => d ? `<div class="trow"><b>${esc(lab)}</b>${d.slots.map(s =>
      `<div class="tchip"><span style="color:var(--brand-strong);font-weight:700">${esc(s.time)}</span><b>${esc(s.people.join(", "))}</b></div>`).join("")}</div>` : "";
    $("#todayList").innerHTML = line(t("rToday"), td) + line(t("rTomorrow"), tm);
  } else tb.hidden = true;

  // 이름 검색 결과
  $("#hits").innerHTML = q ? (duty.days.flatMap(d => d.slots.filter(s => s.people.some(p => p.toLowerCase().includes(ql)))
      .map(s => `<div class="hit"><b>${esc(dLabel(d.date))}</b>${esc(s.time)} <span>${esc(s.role)}</span> — ${hl(s.people.join(", "), q)}</div>`)).join("")
      || `<div class="hit">${esc(t("none"))}</div>`) : "";

  // 주 단위 묶음
  const weeks = [];
  duty.days.forEach(d => {
    const mon = new Date(d.date); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
    const k = dayKey(mon);
    let w = weeks.find(x => x.k === k);
    if (!w) weeks.push(w = { k, mon, days: [] });
    w.days.push(d);
  });
  const thisMon = new Date(now); thisMon.setDate(thisMon.getDate() - ((thisMon.getDay() + 6) % 7)); thisMon.setHours(0,0,0,0);
  const pastCount = weeks.filter(w => w.mon < thisMon).length;
  const visible = weeks.filter(w => showPast || q || w.mon >= thisMon);
  $("#pastBtn").hidden = !pastCount || !!q;
  $("#pastBtn").textContent = showPast ? t("rHidePast") : t("rShowPast", { n: pastCount });
  $("#weeks").innerHTML = (visible.length ? visible : weeks).map(w => {
    const sun = new Date(w.mon); sun.setDate(sun.getDate() + 6);
    const all = [...Array(7).keys()].map(i => { const d = new Date(w.mon); d.setDate(d.getDate() + i); return w.days.find(x => x.key === dayKey(d)) || { key: dayKey(d), date: d, slots: [] }; })
      .filter(d => d.slots.length || (d.date >= w.days[0].date && d.date <= w.days[w.days.length - 1].date));
    return `<div class="wk"><div class="wk-h">${esc(dLabel(w.mon))} ~ ${esc(dLabel(sun))}</div><div class="days">${all.map(d => {
      const wd = d.date.getDay();
      const cls = [d.key === TODAY ? "today" : "", wd === 6 ? "sat" : "", wd === 0 ? "sun" : "", q && !match(d) ? "dim" : ""].join(" ");
      return `<div class="day ${cls}"${d.key === TODAY ? ' id="todayCard"' : ""}><div class="dh">${esc(dLabel(d.date))}</div>${
        d.slots.length ? d.slots.map(s => `<div class="slot"><div class="st">${esc(s.time)}${s.role ? `<small>${esc(s.role)}</small>` : ""}</div><div class="pp">${s.people.map(p => hl(p, q)).join("<br>")}</div></div>`).join("")
        : `<div class="none">—</div>`}</div>`;
    }).join("")}</div></div>`;
  }).join("");
  $("#notes").innerHTML = duty.notes.map(n => `<p>${esc(n)}</p>`).join("");
}

function show(data, isPreview){
  sheets = data.sheets; duty = data.duty; preview = isPreview; cur = pickDefault(); render();
}
function fail(){
  $("#gridWrap").hidden = false; $("#duty").hidden = true;
  $("#tw").innerHTML = `<div class="msg">${esc(t("rFail"))}</div>`;
}

$("#tabs").addEventListener("click", e => { const i = e.target.dataset.i; if (i != null) { cur = +i; render(); } });
$("#q").addEventListener("input", render);
$("#dq").addEventListener("input", render);
$("#pastBtn").onclick = () => { showPast = !showPast; render(); };
$("#file").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = load(await f.arrayBuffer()); if (!d.duty && !d.sheets.length) throw 0; show(d, true); }
  catch (err) { alert(t("rFail")); }
  e.target.value = "";
});
$("#unpreview").onclick = () => published ? show(published, false) : location.reload();

I18N.mountPicker($("#lang"), render);
(async () => {
  for (const f of ROSTER_FILES) {
    try {
      const r = await fetch(encodeURI(f), { cache: "no-cache" });
      if (!r.ok) continue;
      published = load(await r.arrayBuffer());
      if (published.duty || published.sheets.length) { show(published, false); return; }
    } catch (e) {}
  }
  render(); fail();
})();
</script>
</body>
</html>
